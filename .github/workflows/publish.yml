name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v4.4.0)'
        required: true
        type: string

jobs:
  setup-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for authentication using OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate required files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files exist
        run: |
          if [ ! -f "lib/src/Model/experiment.g.dart" ]; then
            echo "Error: experiment.g.dart not generated"
            exit 1
          fi
          echo "Generated files verified successfully"

      - name: Setup Dart with OIDC
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        run: dart pub publish --force
