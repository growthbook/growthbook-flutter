name: Publish to pub.dev

# pub.dev derives the OIDC claims it validates (`ref`, `ref_type`) from the ref
# that triggered the run, not from the ref this workflow checks out. Both
# entry points below therefore have to be started *at the release tag*:
#   - `push: tags:` fires for manually pushed tags;
#   - `workflow_dispatch` must be dispatched with `--ref <tag>` (see
#     release-please.yml) and enabled as an allowed event in the pub.dev
#     automated-publishing settings.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  setup-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for authentication using OIDC
    steps:
      # Fail fast instead of burning a build and getting rejected by pub.dev
      # with "publishing is only allowed from 'tag' refType".
      - name: Verify the run was triggered from a tag
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Error: this workflow must be triggered from a tag, got $REF_TYPE '$REF'."
            echo "Dispatch it with: gh workflow run publish.yml --ref <tag>"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate required files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files exist
        run: |
          if [ ! -f "lib/src/Model/experiment.g.dart" ]; then
            echo "Error: experiment.g.dart not generated"
            exit 1
          fi
          echo "Generated files verified successfully"

      - name: Setup Dart with OIDC
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        run: dart pub publish --force
