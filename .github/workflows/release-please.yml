name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Run dry-run BEFORE build_runner regenerates .g.dart files. Otherwise
      # any drift between the committed generated files and the freshly built
      # ones is reported as "checked-in file is modified in git" (exit 65),
      # blocking the real Release Please step even though the package is
      # otherwise valid. Running dry-run against the clean checkout keeps
      # full publish validation active while avoiding the false positive.
      - name: Check publish warnings
        run: dart pub publish --dry-run

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created by release-please via GITHUB_TOKEN do not trigger the
  # `push: tags:` event in publish.yml (GitHub's guard against workflow
  # recursion), which is why releases never reached pub.dev on their own.
  #
  # Publishing directly from this job would not work either: it runs on
  # `push` to main, so its OIDC token carries ref=refs/heads/main /
  # ref_type=branch, and pub.dev rejects anything that is not a tag ref --
  # checking the tag out does not change the token's claims. Instead we
  # dispatch publish.yml *at the tag ref*, which gives that run an OIDC token
  # with ref=refs/tags/<version> and ref_type=tag. Dispatches sent with
  # GITHUB_TOKEN are exempt from the recursion guard.
  publish:
    needs: validate-and-release
    if: needs.validate-and-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Required to dispatch publish.yml
    steps:
      - name: Dispatch publish workflow at the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate-and-release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$TAG_NAME"
